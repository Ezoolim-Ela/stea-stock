# ============================================================
# STEA - Configuration de l'application
# ============================================================

# --- Serveur ---
server.port=8080
server.servlet.context-path=/api

# --- Base de donnees MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/stea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
app.jwt.secret=c2VjcmV0LWNoYXZlLXN0ZWEtand0LWtleS1mb3ItMjAyNS1wcm9kdWN0aW9u
app.jwt.expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer
app.jwt.token-prefix=Bearer

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5174

# --- Jackson ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- Upload ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
