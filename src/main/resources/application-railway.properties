# ============================================================
# STEA - Configuration Railway (Production)
# ============================================================

# --- Serveur ---
server.port=${PORT:8080}

# --- Base de donnees PostgreSQL (Railway) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stea_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWNoYXZlLXN0ZWEtand0LWtleS1mb3ItMjAyNS1wcm9kdWN0aW9u}
app.jwt.expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer
app.jwt.token-prefix=Bearer

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Jackson ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- Upload ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
